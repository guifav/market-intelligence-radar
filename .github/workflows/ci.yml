name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Compile check
        run: python3 -m compileall -q mir
      - name: Smoke import all modules
        run: |
          python3 -c "
          import mir.scanner
          import mir.enricher
          import mir.classifier
          import mir.icp_policy
          import mir.matcher
          import mir.crm_import
          import mir.llm
          import mir.pg_storage
          import mir.db
          import mir.icps
          import mir.exclusions
          import mir.scraper
          import mir.extractor
          import mir.sources
          import mir.rate_limit
          import mir.data_paths
          print('All module imports OK')
          "

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd app && npm ci
      - name: Audit production dependencies
        run: cd app && npm audit --omit=dev --audit-level=high
      - name: Run authentication tests
        run: cd app && npm test
      - name: Validate Compose security
        run: node scripts/validate-compose-security.mjs
      - run: cd app && npm run build
      - name: Build runtime image
        run: docker build --tag market-intelligence-radar-ci .
      - name: Verify runtime image
        run: |
          docker run --rm --entrypoint sh market-intelligence-radar-ci -c '
            node -e "if (Number(process.versions.node.split(\".\")[0]) !== 22) process.exit(1)" &&
            python3 -c "import sys, psycopg2, mir.db; assert sys.version_info[:2] == (3, 12)"
          '
