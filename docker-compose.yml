services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mir
      POSTGRES_USER: mir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mir"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mir:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/mir
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY}
      AUTH_EMAIL: ${AUTH_EMAIL:?Set AUTH_EMAIL in .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      SALESQL_API_KEY: ${SALESQL_API_KEY:-}
    ports:
      - "${MIR_BIND_ADDRESS:-127.0.0.1}:${MIR_PORT:-3000}:3000"

volumes:
  pgdata:
